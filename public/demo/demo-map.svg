<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fictional sample island for "demo mode". Not a real Rust map, not RustMaps or Facepunch artwork. -->
  <defs>
    <radialGradient id="sea" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2c4a57"/>
      <stop offset="100%" stop-color="#16262e"/>
    </radialGradient>
    <clipPath id="land">
      <path d="M200 260 C 260 140, 470 110, 600 150 C 760 190, 880 260, 890 420 C 900 560, 860 720, 740 820 C 620 910, 420 920, 300 840 C 180 760, 120 620, 130 480 C 135 380, 160 320, 200 260 Z"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <!-- beach outline -->
  <path d="M200 260 C 260 140, 470 110, 600 150 C 760 190, 880 260, 890 420 C 900 560, 860 720, 740 820 C 620 910, 420 920, 300 840 C 180 760, 120 620, 130 480 C 135 380, 160 320, 200 260 Z"
        fill="#c9b98a" stroke="#d8cc9f" stroke-width="10"/>
  <g clip-path="url(#land)">
    <!-- biomes: snow north, forest/temperate middle, desert south-east -->
    <rect x="0" y="0" width="1024" height="1024" fill="#5d7340"/>
    <path d="M0 0 H1024 V300 C 800 340, 600 260, 400 320 C 250 360, 120 300, 0 330 Z" fill="#dfe6ea"/>
    <path d="M520 640 C 640 560, 820 600, 1024 560 V1024 H520 Z" fill="#c8a565"/>
    <path d="M100 520 C 220 480, 330 560, 360 680 C 380 780, 300 900, 100 900 Z" fill="#3f5a2e"/>
    <!-- hills shading -->
    <ellipse cx="330" cy="430" rx="120" ry="70" fill="#000" opacity="0.12"/>
    <ellipse cx="700" cy="350" rx="90" ry="60" fill="#000" opacity="0.10"/>
    <ellipse cx="420" cy="760" rx="80" ry="50" fill="#000" opacity="0.10"/>
  </g>
  <!-- river and lake -->
  <path d="M560 180 C 540 300, 600 380, 560 480 C 520 580, 470 640, 480 760 C 485 820, 470 860, 450 900"
        fill="none" stroke="#4f7f97" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="610" cy="470" rx="38" ry="26" fill="#4f7f97"/>
  <!-- ring road -->
  <path d="M260 300 C 380 220, 640 220, 760 320 C 840 420, 820 620, 720 730 C 600 840, 400 840, 300 740 C 210 640, 190 420, 260 300 Z"
        fill="none" stroke="#8a7a62" stroke-width="7" stroke-dasharray="1 0"/>
  <!-- rail -->
  <path d="M220 560 C 400 520, 620 520, 840 470" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-dasharray="14 6"/>
  <!-- monument footprints (labels come from the app, not the image) -->
  <g fill="#3a3a38" stroke="#1d1d1c" stroke-width="2">
    <rect x="470" y="440" width="70" height="55"/>
    <rect x="760" y="560" width="50" height="40"/>
    <rect x="300" y="250" width="55" height="45"/>
    <rect x="680" y="760" width="45" height="35"/>
    <rect x="215" y="610" width="40" height="40"/>
    <rect x="610" y="205" width="35" height="30"/>
    <rect x="400" y="820" width="40" height="30"/>
    <rect x="820" y="380" width="35" height="35"/>
  </g>
  <text x="512" y="1000" text-anchor="middle" font-family="monospace" font-size="20" fill="#9fb3bb" opacity="0.8">SAMPLE ISLAND · DEMO DATA · NOT A REAL MAP</text>
</svg>
